name: Nightly shellcheck

# Re-runs shellcheck on a schedule (when activated) and on demand.
# Catches drift in apt's shellcheck version that could surface new
# warnings before a PR introduces them.
#
# Runs daily at 05:00 UTC plus on-demand via workflow_dispatch.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'  # 05:00 UTC daily

jobs:
  shellcheck:
    name: shellcheck (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck -S warning ralph*.sh docker/*.sh
        run: shellcheck -S warning --exclude=SC2034,SC2207 ralph*.sh docker/*.sh
